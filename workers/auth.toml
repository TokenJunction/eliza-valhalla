# Sign-in Worker. Not deployed until the zone email and the client ID are ready.
# Secrets and ids, never committed:
#   DEVICE_COOKIE_SECRET      long random string for the device cookie and the session token
#   RESEND_API_KEY            only if Cloudflare Email Sending is not onboarded yet
#   LEADER_EMAIL              Google-authenticated account authorized for manager access
#   MASTER_ADMIN_EMAIL        optional second Google-authenticated owner alias
#   AUTH_KV                   KV namespace id
# Configure LEADER_EMAIL as a Worker secret; an unset value disables owner access.
# Set it with: npx wrangler secret put LEADER_EMAIL --config workers/auth.toml
# Email Sending on the valhalla-app.xyz zone can send to any inbox after the
# domain is onboarded (Workers Paid). Before that, the EMAIL binding can send
# only to verified destination addresses. Resend is the fallback.
name = "valhalla-auth"
main = "auth.js"
compatibility_date = "2026-11-03"

# Public client id. The Worker rejects a token whose aud is not this value.
[vars]
GOOGLE_CLIENT_ID = "1085862906383-cmiqc9bu96uqigm73nb3jkp5vfjf9b7l.apps.googleusercontent.com"

[[send_email]]
name = "EMAIL"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "9f0316ce34f84f53bf3ffa5ef31cbe72"
