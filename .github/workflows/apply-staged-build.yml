name: Apply staged Valhalla build
run-name: apply-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      tarball_url:
        description: Public HTTPS URL of the verified build tarball
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of the tarball
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apply-staged-build
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/site
          fetch-depth: 0
      - name: Verify and apply the staged tree
        env:
          TARBALL_URL: ${{ inputs.tarball_url }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TARBALL_URL" == https://* ]] || { echo "HTTPS tarball required" >&2; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid SHA-256" >&2; exit 1; }
          curl --fail --silent --show-error --location --max-time 180 "$TARBALL_URL" -o "$RUNNER_TEMP/build.tar.gz"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/build.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/build"
          tar -xzf "$RUNNER_TEMP/build.tar.gz" -C "$RUNNER_TEMP/build"
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/build/" ./
          git config user.name "Valhalla deploy"
          git config user.email "deploy@valhalla.local"
          git add -A
          git commit -m "feat(elizaos): deploy Solana mint snapshots and proposal-only coding"
          git push origin HEAD:docs/site
