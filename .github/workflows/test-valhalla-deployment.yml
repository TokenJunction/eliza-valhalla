name: Test Valhalla deployment repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-staged-build
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/site
          fetch-depth: 0
      - name: Apply the verified staged tree
        env:
          TARBALL_URL: https://girltjnrrwlyeufrcors.supabase.co/storage/v1/object/public/valos-public/deploy/valhalla-elizaos-780833f.tar.gz
          EXPECTED_SHA256: 4983daa414d4876ec020f26cf3e98aaf486e7e147836aaf23135843fba15adc5
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 180 "$TARBALL_URL" -o "$RUNNER_TEMP/build.tar.gz"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/build.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/build"
          tar -xzf "$RUNNER_TEMP/build.tar.gz" -C "$RUNNER_TEMP/build"
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/build/" ./
          git config user.name "Valhalla deploy"
          git config user.email "deploy@valhalla.local"
          git add -A
          git commit -m "feat(elizaos): deploy Solana mint snapshots and proposal-only coding"
          git push origin HEAD:docs/site
